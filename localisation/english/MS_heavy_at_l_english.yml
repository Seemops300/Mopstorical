l_english:
 MS_heavy_anti_tank_brigade: "Heavy Anti-Tank"
 MS_heavy_anti_tank_brigade_desc: "Big long-barrelled guns towed by trucks. They cost twice as much as normal anti-tank guns, need more supply and struggle on bad ground, but they can still punch through the heaviest tanks."
 MS_heavy_anti_tank_equipment: "Towed Heavy Anti-Tank"
 MS_heavy_anti_tank_equipment_short: "Heavy Anti-Tank"
 MS_heavy_anti_tank_equipment_desc: "A large direct-fire gun built to defeat the thickest armor. Heavy and expensive, it has to be towed into position by trucks."
 MS_heavy_anti_tank_equipment_1: "Heavy Anti-Tank I"
 MS_heavy_anti_tank_equipment_1_short: "Heavy Anti-Tank I"
 MS_heavy_anti_tank_equipment_1_desc: "A field-gun sized anti-tank weapon able to defeat any tank currently in service."
 MS_heavy_anti_tank_equipment_2: "Heavy Anti-Tank II"
 MS_heavy_anti_tank_equipment_2_short: "Heavy Anti-Tank II"
 MS_heavy_anti_tank_equipment_2_desc: "A very long, very powerful gun on a heavy carriage, made to kill the newest heavy tanks at long range."
 MS_heavy_antitank1: "Heavy Anti-Tank I"
 MS_heavy_antitank1_desc: "Field-gun sized anti-tank weapons, towed by trucks. Unlocks the Heavy Anti-Tank battalion."
 MS_heavy_antitank2: "Heavy Anti-Tank II"
 MS_heavy_antitank2_desc: "Very long guns on heavy carriages, made to defeat the newest heavy tanks."
